# Deploy receipt UI to Vercel production on every push to main.
# Bypasses a stuck Vercel Git "Production Branch" (e.g. old PR preview branch).
#
# Required GitHub repo secrets (Settings → Secrets and variables → Actions):
#   VERCEL_TOKEN      — https://vercel.com/account/tokens
#   VERCEL_ORG_ID     — Vercel → Team Settings → General, or .vercel/project.json after vercel link
#   VERCEL_PROJECT_ID — Project → Settings → General → Project ID
# Optional (if not set in Vercel project env):
#   VITE_API_URL      — e.g. https://coupon-sentinel-api.onrender.com

name: Vercel frontend production

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/vercel-frontend-production.yml'

concurrency:
  group: vercel-frontend-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Vercel CLI
        run: npm install --global vercel@39.4.0

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: |
          # Only override Vercel-pulled env when the GitHub secret is set.
          # An empty env var would make Vite ignore values from vercel pull.
          if [ -n "$VITE_API_URL_OVERRIDE" ]; then
            export VITE_API_URL="$VITE_API_URL_OVERRIDE"
          fi
          vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VITE_API_URL_OVERRIDE: ${{ secrets.VITE_API_URL }}

      - name: Deploy prebuilt to production
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

databases:
  # Managed Postgres for Milestone 1 persistence (users, subscriptions, evidence layer).
  - name: coupon-sentinel-db
    plan: free
    databaseName: coupon_sentinel
    user: coupon_sentinel

services:
  # Backend API Service
  - type: web
    name: coupon-sentinel-api
    runtime: python
    plan: free
    rootDir: .
    buildCommand: pip install -r backend/requirements.txt && cd backend && alembic upgrade head
    # Use backend/run.py — sets sys.path before importing backend (avoids ModuleNotFoundError)
    startCommand: python3 backend/run.py
    envVars:
      - key: PORT
        value: 8000
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: PYTHONPATH
        value: .
      - key: DATABASE_URL
        fromDatabase:
          name: coupon-sentinel-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: STRIPE_SECRET_KEY
        sync: false  # Set manually in Render dashboard — real key, never in git
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_ID_PRO
        sync: false
      - key: STRIPE_PRICE_ID_PREMIUM
        sync: false
    healthCheckPath: /health
    autoDeploy: true

  # Frontend Static Site
  - type: web
    name: coupon-sentinel-frontend
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm run preview -- --port $PORT
    envVars:
      - key: VITE_API_URL
        sync: false  # Set this manually in Render dashboard after backend deploys
        # Example: https://coupon-sentinel-api.onrender.com
      - key: PORT
        value: 3000
    autoDeploy: true
